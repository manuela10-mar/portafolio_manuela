  <main class="contenedor-pago">
    <h1>Resumen de tu compra</h1>
    <div id="resumen-compra"></div>
    <h3 id="total"></h3>
    <button id="finalizar-compra" class="btn btn-success">Finalizar compra</button>

    <!-- Sección de métodos de pago -->
    <section class="metodo-pago">
      <h3 class="titulo-seccion">Método de pago</h3>
      <p>Compra utilizando varios métodos de pago disponibles.</p>

      <div class="metodos">
        <div class="metodo promo popular">
          <img src="../img/pago/nequi_logo.jpeg" alt="Nequi" class="logo-pago">
         <img src="../img/pago/bancolombia.svg" alt="Efecty" class="logo-pago">
          <div class="info-pago">
            <span class="precio">Nequi</span>
            <span class="bonus">Bancolombia</span>
          </div>
        </div>

        <div class="metodo promo">
          <img src="../img/pago/bbva_logo.png" alt="Visa y Mastercard" class="logo-pago">
         <img src="../img/pago/visa_logo.svg" alt="Efecty" class="logo-pago">
          <div class="info-pago">
            <span class="precio">Banco BBVA</span>
            <span class="bonus">Visa</span>
          </div>
        </div>

        <div class="metodo promo">
          <img src="../img/pago/efecty_logo2.svg" alt="Efecty" class="logo-pago">
         <img src="../img/pago/mastercard_logo.svg" alt="Efecty" class="logo-pago">
          <div class="info-pago">
            <span class="precio">Efecty</span>
            <span class="bonus">Efecty</span>
          </div>
        </div>

        <div class="metodo promo">
          <img src="../img/pago/daviplata_logo.jpeg" alt="Daviplata" class="logo-pago">
          <div class="info-pago">
            <span class="precio">Daviplata</span>
            <span class="bonus">Davivienda</span>
          </div>
        </div>
      </div>
    </section>
