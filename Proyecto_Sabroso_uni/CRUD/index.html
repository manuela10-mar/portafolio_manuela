<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD CULTIVO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/970d5b9427.js" crossorigin="anonymous"></script>
</head>
<body>
  <h1 class="text-center p-3">TITULO</h1>

  <div class="container-fluid row">
    <form id="formCultivo" class="col-4 p-3">
      <h3 class="text-center text-secondary">Registro de Cultivos</h3>

      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de Cultivo</label>
        <input type="text" id="tipo" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="cantidad" class="form-label">Cantidad de Cosecha</label>
        <input type="number" id="cantidad" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="siembra" class="form-label">Fecha de Siembra</label>
        <input type="date" id="siembra" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="recoleccion" class="form-label">Fecha de Recoleccion</label>
        <input type="date" id="recoleccion" class="form-control" required />
      </div>

      <button type="submit" class="btn btn-success">Registrar</button>
    </form>

    <div class="col-8 p-4">
      <table class="table">
        <thead class="bg-info">
          <tr>
            <th scope="col">Tipo de Cultivo</th>
            <th scope="col">Cantidad de Cosecha</th>
            <th scope="col">Fecha de Siembra</th>
            <th scope="col">Fecha de Recoleccion</th>
            <th scope="col">Editar</th>
            <th scope="col">Eliminar</th>
          </tr>
        </thead>
        <tbody id="tablaC"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="crud.js"></script>
</body>
</html>
